name: Release

# release-please keeps a release PR open with the next version and changelog. Merging that PR
# creates the tag and the GitHub release notes, and then the job below publishes the bundle to
# Cloudsmith, the only download source. See RELEASING.md.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Update the release PR, or create the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag and the release
      pull-requests: write # open and update the release PR
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # CI does not run on a PR that the default token opens. The Cloudsmith Bot token fixes that.
          token: ${{ secrets.CLOUDSMITH_BOT_PR_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  cloudsmith:
    name: Publish to Cloudsmith
    needs: release-please
    if: needs.release-please.outputs.created == 'true' && vars.RELEASE_CLOUDSMITH_REPO != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # exchanged for a Cloudsmith token through OIDC
    env:
      CLOUDSMITH_ORG: ${{ vars.RELEASE_CLOUDSMITH_ORG }}
      CLOUDSMITH_REPO: ${{ vars.RELEASE_CLOUDSMITH_REPO }}
      CLOUDSMITH_SERVICE_SLUG: ${{ vars.RELEASE_CLOUDSMITH_SERVICE_SLUG }}

    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - name: Set up the toolchain with mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false

      - name: Publish the bundle
        run: mise run publish:cloudsmith
